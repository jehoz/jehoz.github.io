<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>projects</title>

    <link rel="stylesheet" type="text/css" href="/static/style/common.css">
    <link rel="stylesheet" type="text/css" href="/static/style/projects.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans&display=swap" rel="stylesheet">

    <script>
        let projects = [
            {
                name: "propnet",
                link: "https://github.com/jehoz/propnet",
                blurb: "Framework for relational programming using propagator networks",
                image: "/static/img/thumbnails/propnet-wfc.gif",
                tags: [
                        "haskell",
                    ],
            },
            {
                name: "nebulizer",
                link: "https://github.com/jehoz/nebulizer",
                blurb: "A granular synthesizer",
                image: "/static/img/thumbnails/naenae-cat.gif",
                tags: [
                        "rust",
                        "music",
                    ],
            },
            {
                name: "terrain-erosion",
                link: "https://github.com/jehoz/terrain-erosion",
                blurb: "A hydraulic erosion simulator for virtual terrain",
                image: "/static/img/thumbnails/erosion-terrain.png",
                tags: [
                        "zig",
                        "graphics",
                        "simulation",
                    ],
            },
            {
                name: "legs-and-gaits",
                link: "https://github.com/jehoz/legs-and-gaits",
                blurb: "Procedural quadruped leg anatomy and gait animations",
                image: "/static/img/thumbnails/creature-walk.gif",
                tags: [
                        "godot",
                        "graphics",
                        "simulation",
                    ],
            },
            {
                name: "psyn",
                link: "https://github.com/jehoz/psyn",
                blurb: "UDP-controlled sampler for livecoding setups",
                image: "/static/img/thumbnails/naenae-cat.gif",
                tags: [
                        "go",
                        "music",
                    ],
            },
            {
                name: "shove",
                link: "https://github.com/jehoz/shove",
                blurb: "Scripting language designed around composing pipelines",
                image: "/static/img/thumbnails/naenae-cat.gif",
                tags: [
                        "haskell",
                    ],
            },
        ];

        function populateProjects() {
            let wrapper = document.getElementById("projects-wrapper");
            wrapper.innerHTML = "";
            for (const p of projects) {
                let projectHTML = `
                <a class="project-link" href="${p.link}">
                    <div class="project-name">${p.name}</div>
                    <div class="project-thumbnail">
                    <img src="${p.image}" />
                    </div>
                    <div class="project-blurb">${p.blurb}</div>
                </a>
                `;
                wrapper.innerHTML += projectHTML;
            }
        }

        document.addEventListener("DOMContentLoaded", populateProjects);
    </script>
</head>

<body>
    <div class="nav-bar">
        <a class="nav-button" href="/">
            home
        </a>
        <a class="nav-button" href="/projects.html">

        </a>
        <a class="nav-button" href="/blog.html">

        </a>
        <a class="nav-button" href="/contact.html">
            contact
        </a>
    </div>
    <div class="content">
        <div class="content-header">
            PROJECTS
        </div>
        <div id="projects-wrapper">
            <!-- Project cards are dynamically generated and put here -->
        </div>

    </div>
</body>

</html>
