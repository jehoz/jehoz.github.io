<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" type="text/css" href="/static/style/common.css">
    <link rel="stylesheet" type="text/css" href="/static/style/blog.css">

    <script>
        let pages = [
            {
                url: "/projects.html",
                title: "",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "",
                datePretty: "",
                template: "projects.html",
            },
            {
                url: "/blog.html",
                title: "",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "",
                datePretty: "",
                template: "blog.html",
            },
            {
                url: "/index.html",
                title: "",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "",
                datePretty: "",
                template: "index.html",
            },
            {
                url: "/articles/2024/09/05/propagator_networks_pcg.html",
                title: "Propagator Networks and Constraint Satisfaction Problems",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "2024-09-05",
                datePretty: "Sep 5, 2024",
                template: "article.html",
            },
            {
                url: "/articles/2024/05/10/parametric_legs_and_gaits.html",
                title: "Modeling Tetrapod Legs and Gait Animations",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "2024-05-10",
                datePretty: "May 10, 2024",
                template: "article.html",
            },
            {
                url: "/articles/2023/12/01/hydraulic_erosion.html",
                title: "Generating Realistic Terrain with Hydraulic Erosion",
                blurb: "",
                thumbnail: "/static/img/thumbnails/",
                date: "2023-12-01",

            },
            {

                date: "2023-10-20",
                datePretty: "Oct 20, 2023",
                template: "article.html",
            },
        ];

        function populatePageList() {
            pages.sort((a, b) => (b.date.localeCompare(a.date)));

            let listWrapper = document.getElementById("pages-list-wrapper");
            listWrapper.innerHTML = "";
            for (const a of pages) {
                if (a.template != "article.html") continue;

                let articleHTML = `
                <a class="article-link" href="${a.url}">
                    <div class="article-date">${a.date}</div>
                    <div class="spacer"></div>
                    <div class="article-title">${a.title}</div>
                </a>
                `
                listWrapper.innerHTML += articleHTML;
            }
        }

        document.addEventListener("DOMContentLoaded", populatePageList);
    </script>
